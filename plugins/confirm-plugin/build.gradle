/**
 * Wave 5 cycle/workflow-suspend-resume: built-in confirmation workflow step
 * plugin. Ships with Rundeck OSS core. See docs/specs/confirm-workflow-step.md.
 */

ext.pluginClassNames = 'org.rundeck.plugin.confirm.ConfirmWorkflowStep'
ext.pluginName = 'Confirm'
ext.pluginDescription = 'Pause workflow for human confirmation (approve/deny)'
apply plugin: "java"

apply from: "../../gradle/java-version.gradle"

jar {
    manifest {
        attributes 'Rundeck-Plugin-Classnames': pluginClassNames
        attributes 'Rundeck-Plugin-Name': pluginName
        attributes 'Rundeck-Plugin-Description': pluginDescription
    }
}

dependencies {
    testImplementation "org.spockframework:spock-core:${spockVersion}"
}

tasks.withType(Test) {
    useJUnitPlatform()
}
